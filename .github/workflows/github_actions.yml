name: BetterVRCX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  set_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
      display_version: ${{ steps.version.outputs.display_version }}
      product_version: ${{ steps.version.outputs.product_version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          RAW_VERSION="$(cat Version | tr -d '\r\n')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              TAG="${GITHUB_REF_NAME}"
          else
              TAG="${RAW_VERSION%% *}"
              if [[ -z "${TAG}" || "${TAG}" != v* ]]; then
                  TAG="v3.2.1"
              fi
          fi
          CLEAN_TAG="${TAG#v}"

          if [[ "${RAW_VERSION}" == *"B "* ]]; then
              DATE="${RAW_VERSION##*B }"
          else
              DATE="${RAW_VERSION}"
          fi
          if [[ -z "${DATE}" ]]; then
              DATE="2026.07.18"
          fi

          DISPLAY_VERSION="${TAG} B ${DATE}"
          PRODUCT_VERSION="${CLEAN_TAG}.0"

          echo "version=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "display_version=${DISPLAY_VERSION}" >> $GITHUB_OUTPUT
          echo "product_version=${PRODUCT_VERSION}" >> $GITHUB_OUTPUT

  build_dotnet_windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: [set_version, build_node]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.display_version }}" > Version
          echo "!define PRODUCT_VERSION_FROM_FILE \"${{ needs.set_version.outputs.product_version }}\"" > Installer/version_define.nsh
          echo "!define DISPLAY_VERSION_FROM_FILE \"${{ needs.set_version.outputs.display_version }}\"" >> Installer/version_define.nsh
          cat Version
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Cef.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Cef .NET Application
        run: dotnet build Dotnet/VRCX-Cef.csproj -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a x64 --self-contained
      - name: Configure Google Drive OAuth client
        env:
          BETTERVRCX_GOOGLE_CLIENT_ID: ${{ vars.BETTERVRCX_GOOGLE_CLIENT_ID }}
          BETTERVRCX_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERVRCX_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "${BETTERVRCX_GOOGLE_CLIENT_ID}" || -z "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" ]]; then
            echo "Missing BETTERVRCX_GOOGLE_CLIENT_ID variable or BETTERVRCX_GOOGLE_CLIENT_SECRET secret." >&2
            exit 1
          fi
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_ID}" > build/Cef/google-drive-client-id.txt
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" > build/Cef/google-drive-client-secret.txt
      - name: Check if we want to sign
        id: check_sign
        run: |
          echo "sign=${{ secrets.AZURE_CLIENT_ID != '' }}" >> $GITHUB_OUTPUT
      - name: Azure login
        if: steps.check_sign.outputs.sign == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Dotnet executables
        if: steps.check_sign.outputs.sign == 'true'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_PROFILE_NAME }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          files: |
            ${{ github.workspace }}\build\Cef\CefSharp.BrowserSubprocess.Core.dll
            ${{ github.workspace }}\build\Cef\CefSharp.Core.dll
            ${{ github.workspace }}\build\Cef\CefSharp.Core.Runtime.dll
            ${{ github.workspace }}\build\Cef\CefSharp.dll
            ${{ github.workspace }}\build\Cef\CefSharp.OffScreen.dll
            ${{ github.workspace }}\build\Cef\CefSharp.WinForms.dll
            ${{ github.workspace }}\build\Cef\DiscordRPC.dll
            ${{ github.workspace }}\build\Cef\libcef.dll
            ${{ github.workspace }}\build\Cef\libEGL.dll
            ${{ github.workspace }}\build\Cef\libGLESv2.dll
            ${{ github.workspace }}\build\Cef\librsync.net.dll
            ${{ github.workspace }}\build\Cef\BetterVRCX.dll
            ${{ github.workspace }}\build\Cef\BetterVRCX.exe

      - name: Download Cef-html artifacts
        uses: actions/download-artifact@v8
        with:
          name: Cef-html
          path: build/Cef/html
      - name: Install NSIS
        run: choco install nsis -y
      - name: Create NSIS installer
        run: |
          mkdir -p "C:/Program Files (x86)/NSIS/Plugins/x86-unicode"
          cp -f Installer/Plugins/x86-unicode/*.dll "C:/Program Files (x86)/NSIS/Plugins/x86-unicode/"
          "C:/Program Files (x86)/NSIS/makensis.exe" -V4 -INPUTCHARSET UTF8 Installer/installer.nsi
      - name: Rename setup
        run: |
          file_name="BetterVRCX_Setup_${{ needs.set_version.outputs.tag }}.exe"
          echo "Setup FileName: ${file_name}"
          if [ -f "Installer/BetterVRCX_Setup.exe" ]; then
            mv Installer/BetterVRCX_Setup.exe $file_name
          elif [ -f "BetterVRCX_Setup.exe" ]; then
            mv BetterVRCX_Setup.exe $file_name
          fi

      - name: Sign Cef setup
        uses: azure/trusted-signing-action@v1
        if: steps.check_sign.outputs.sign == 'true'
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_PROFILE_NAME }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          files: |
            ${{ github.workspace }}\BetterVRCX_Setup_${{ needs.set_version.outputs.tag }}.exe

      - name: VirusTotal scan and update README badges
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY || secrets.VT_API_KEY }}
        run: |
          node ./build-scripts/virustotal-scan.mjs --file=build/Cef/BetterVRCX.exe --version=${{ needs.set_version.outputs.version }}

      - name: Commit updated VirusTotal scan and READMEs
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README/
          if git diff-index --quiet HEAD; then
            echo "No VirusTotal README changes to commit."
            exit 0
          fi
          git commit -m "docs: update VirusTotal scan and badges [skip ci]"
          git push origin HEAD:refs/heads/master

      - name: Upload Cef dotnet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BetterVRCX-Cef-Release
          path: build/Cef
      - name: Upload setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: BetterVRCX-Setup
          path: BetterVRCX_Setup_${{ needs.set_version.outputs.tag }}.exe

  build_dotnet_linux:
    runs-on: ubuntu-latest
    needs: set_version
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.display_version }}" > Version
          cat Version
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Electron.csproj') }}-${{ hashFiles('**/Dotnet/VRCX-Electron-arm64.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Electron x64 .NET Application
        run: dotnet build 'Dotnet/VRCX-Electron.csproj' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a x64
      - name: Configure Google Drive OAuth client
        env:
          BETTERVRCX_GOOGLE_CLIENT_ID: ${{ vars.BETTERVRCX_GOOGLE_CLIENT_ID }}
          BETTERVRCX_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERVRCX_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "${BETTERVRCX_GOOGLE_CLIENT_ID}" || -z "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" ]]; then
            echo "Missing BETTERVRCX_GOOGLE_CLIENT_ID variable or BETTERVRCX_GOOGLE_CLIENT_SECRET secret." >&2
            exit 1
          fi
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_ID}" > build/Electron/google-drive-client-id.txt
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" > build/Electron/google-drive-client-secret.txt
      - name: Upload Electron x64 dotnet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-Release-Linux-x64
          path: build/Electron

      - name: Cleanup
        run: |
          rm -R build/Electron

      - name: Build Electron arm64 .NET Application
        run: dotnet build 'Dotnet/VRCX-Electron-arm64.csproj' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=arm64 -p:PlatformTarget=arm64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a arm64
      - name: Configure Google Drive OAuth client
        env:
          BETTERVRCX_GOOGLE_CLIENT_ID: ${{ vars.BETTERVRCX_GOOGLE_CLIENT_ID }}
          BETTERVRCX_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERVRCX_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "${BETTERVRCX_GOOGLE_CLIENT_ID}" || -z "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" ]]; then
            echo "Missing BETTERVRCX_GOOGLE_CLIENT_ID variable or BETTERVRCX_GOOGLE_CLIENT_SECRET secret." >&2
            exit 1
          fi
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_ID}" > build/Electron/google-drive-client-id.txt
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" > build/Electron/google-drive-client-secret.txt
      - name: Upload Electron arm64 dotnet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-Release-Linux-arm64
          path: build/Electron

  build_dotnet_macos:
    runs-on: macos-latest
    needs: set_version
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.display_version }}" > Version
          cat Version
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Electron.csproj') }}-${{ hashFiles('**/Dotnet/VRCX-Electron-arm64.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Electron x64 .NET Application
        run: dotnet build 'Dotnet/VRCX-Electron.csproj' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a x64
      - name: Configure Google Drive OAuth client
        env:
          BETTERVRCX_GOOGLE_CLIENT_ID: ${{ vars.BETTERVRCX_GOOGLE_CLIENT_ID }}
          BETTERVRCX_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERVRCX_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "${BETTERVRCX_GOOGLE_CLIENT_ID}" || -z "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" ]]; then
            echo "Missing BETTERVRCX_GOOGLE_CLIENT_ID variable or BETTERVRCX_GOOGLE_CLIENT_SECRET secret." >&2
            exit 1
          fi
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_ID}" > build/Electron/google-drive-client-id.txt
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" > build/Electron/google-drive-client-secret.txt
      - name: Upload Electron x64 .NET artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-Release-macOS-x64
          path: build/Electron

      - name: Cleanup
        run: |
          rm -R build/Electron

      - name: Build Electron arm64 .NET Application
        run: dotnet build 'Dotnet/VRCX-Electron-arm64.csproj' -p:Configuration=Release -p:WarningLevel=0 -p:Platform=arm64 -p:PlatformTarget=arm64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a arm64
      - name: Configure Google Drive OAuth client
        env:
          BETTERVRCX_GOOGLE_CLIENT_ID: ${{ vars.BETTERVRCX_GOOGLE_CLIENT_ID }}
          BETTERVRCX_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERVRCX_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "${BETTERVRCX_GOOGLE_CLIENT_ID}" || -z "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" ]]; then
            echo "Missing BETTERVRCX_GOOGLE_CLIENT_ID variable or BETTERVRCX_GOOGLE_CLIENT_SECRET secret." >&2
            exit 1
          fi
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_ID}" > build/Electron/google-drive-client-id.txt
          printf '%s\n' "${BETTERVRCX_GOOGLE_CLIENT_SECRET}" > build/Electron/google-drive-client-secret.txt
      - name: Upload Electron arm64 dotnet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-Release-macOS-arm64
          path: build/Electron

  build_node:
    runs-on: ubuntu-latest
    needs: [set_version, build_dotnet_linux]
    steps:
      - uses: actions/checkout@v6
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.display_version }}" > Version
          cat Version
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore dependencies
        run: npm ci
      - name: Build Cef-html
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SentryAuthToken }}
        run: npm run prod
      - name: Upload Cef-html artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cef-html
          path: build/html

      - name: Build Electron-html
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SentryAuthToken }}
        run: npm run prod-linux
      - name: Download Electron x64 dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release-Linux-x64
          path: build/Electron
      - name: Build x64 AppImage
        run: npm run build-electron
      - name: Upload Electron x64 AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-AppImage-x64
          path: 'build/BetterVRCX_${{ needs.set_version.outputs.tag }}_x64.AppImage'

      - name: Download Electron arm64 dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release-Linux-arm64
          path: build/Electron
      - name: Build arm64 AppImage
        run: npm run build-electron-arm64
      - name: Upload Electron arm64 AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-AppImage-arm64
          path: 'build/BetterVRCX_${{ needs.set_version.outputs.tag }}_arm64.AppImage'

  build_macos:
    runs-on: macos-latest
    needs: [set_version, build_dotnet_macos]
    steps:
      - uses: actions/checkout@v6
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.display_version }}" > Version
          cat Version
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore dependencies
        run: npm ci
      - name: Build Electron-html
        run: npm run prod-linux --arch=x64

      - name: Download x64 Electron dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release-macOS-x64
          path: build/Electron
      - name: Build x64 macOS .dmg
        run: npm run build-electron
      - name: Upload x64 Electron macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-MacDmg-x64
          path: 'build/BetterVRCX_${{ needs.set_version.outputs.tag }}_x64.dmg'

      - name: Cleanup
        run: |
          rm -R build/Electron

      - name: Build Electron-html
        run: npm run prod-linux --arch=arm64

      - name: Download arm64 Electron dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release-macOS-arm64
          path: build/Electron
      - name: Build arm64 macOS .dmg
        run: npm run build-electron-arm64
      - name: Upload arm64 Electron macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-MacDmg-arm64
          path: 'build/BetterVRCX_${{ needs.set_version.outputs.tag }}_arm64.dmg'

  create_setup:
    runs-on: ubuntu-latest
    needs:
      [
        set_version,
        build_dotnet_windows,
        build_dotnet_linux,
        build_dotnet_macos,
        build_node,
        build_macos
      ]
    steps:
      - name: Download Cef-Setup artifacts
        uses: actions/download-artifact@v8
        with:
          name: BetterVRCX-Setup
      - name: Download Cef dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: BetterVRCX-Cef-Release
          path: build/Cef
      - name: Download Cef-html artifacts
        uses: actions/download-artifact@v8
        with:
          name: Cef-html
          path: build/Cef/html

      - name: Make zip
        run: |
          file_name="BetterVRCX_${{ needs.set_version.outputs.tag }}.zip"
          cd build/Cef
          7z a -tzip ${file_name} * -mx=7 -xr0!*.log
          mv ${file_name} ../../${file_name}
          echo "Zip FileName: ${file_name}"
      - name: Upload Zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: BetterVRCX-Zip
          path: 'BetterVRCX_${{ needs.set_version.outputs.tag }}.zip'

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        set_version,
        build_dotnet_windows,
        build_dotnet_linux,
        build_dotnet_macos,
        build_node,
        build_macos,
        create_setup
      ]
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v8
        with:
          name: BetterVRCX-Setup
          path: assets/

      - name: Download Windows Zip
        uses: actions/download-artifact@v8
        with:
          name: BetterVRCX-Zip
          path: assets/

      - name: Download Linux x64 AppImage
        uses: actions/download-artifact@v8
        with:
          name: Electron-AppImage-x64
          path: assets/

      - name: Download Linux arm64 AppImage
        uses: actions/download-artifact@v8
        with:
          name: Electron-AppImage-arm64
          path: assets/

      - name: Download macOS x64 DMG
        uses: actions/download-artifact@v8
        with:
          name: Electron-MacDmg-x64
          path: assets/

      - name: Download macOS arm64 DMG
        uses: actions/download-artifact@v8
        with:
          name: Electron-MacDmg-arm64
          path: assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: '${{ needs.set_version.outputs.display_version }}'
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            assets/*
